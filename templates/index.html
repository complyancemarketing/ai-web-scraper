<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Web Scraper - Welcome Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">
                        <i class="fas fa-robot"></i>
                    </div>
                    <div class="logo-text">
                        <h1>AI Web Scraper</h1>
                        <p>Powered by Complyance</p>
                    </div>
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <ul class="nav-list">
                    <li class="nav-item active">
                        <a href="{{ url_for('index') }}" class="nav-link">
                            <i class="fas fa-home"></i>
                            <span>Home</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="{{ url_for('tasks') }}" class="nav-link">
                            <i class="fas fa-list"></i>
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="{{ url_for('latest_updates') }}" class="nav-link">
                            <i class="fas fa-bell"></i>
                            <span>Latest Updates</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="{{ url_for('government_dashboard') }}" class="nav-link">
                            <i class="fas fa-landmark"></i>
                            <span>Government Dashboard</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="{{ url_for('integrated_apps') }}" class="nav-link">
                            <i class="fas fa-plug"></i>
                            <span>Integrated Apps</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="welcome-message">
                <div class="welcome-content">
                    <div class="talking-robot">
                        <div class="robot-body">
                            <i class="fas fa-user-astronaut"></i>
                        </div>
                        <div class="speech-bubble">
                            <div class="speech-text">
                                <span class="typing-text">Welcome to Complyance AI Scraping Dashboard!</span>
                            </div>
                            <div class="speech-questions">
                                <span class="question-text">Ready to automate your web scraping?</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
